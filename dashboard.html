<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>g医t</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6fa;
    --fg: #14171f;
    --muted: #5b6270;
    --border: #e2e5ec;
    --link: #4550e5;
    --code-bg: #eef0f8;
    --chip-bg: #ffffff;
    --accent: #4550e5;
    --accent-2: #12b76a;
    --card-bg: #ffffff;
    --shadow: 0 1px 2px rgba(20, 23, 31, 0.06), 0 4px 12px rgba(20, 23, 31, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d14;
      --fg: #e8eaf2;
      --muted: #8a90a2;
      --border: #232734;
      --link: #8c93ff;
      --code-bg: #171a24;
      --chip-bg: #171a24;
      --accent: #8c93ff;
      --accent-2: #3fd08a;
      --card-bg: #12141d;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 20px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding-block: 2rem;
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding-inline: 16px;
  }
  nav.style-switch {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 1.5rem;
  }
  nav.style-switch a {
    font-size: 0.8rem;
    padding: 0.3em 0.8em;
    border-radius: 2em;
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    background: var(--card-bg);
  }
  nav.style-switch a:hover { color: var(--fg); border-color: var(--accent); }
  nav.style-switch a[aria-current="page"] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
  header p { color: var(--muted); margin: 0; }
  #status { color: var(--muted); font-size: 0.85em; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-bottom: 2rem;
  }
  .stat {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label {
    font-size: 0.75rem;
    color: var(--muted);
  }
  #content { word-break: break-word; }
  .entry {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 1.1rem 1.4rem;
    margin-bottom: 1rem;
    position: relative;
    padding-left: 1.6rem;
  }
  .entry::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.9rem;
    bottom: 0.9rem;
    width: 5px;
    border-radius: 3px;
    background: var(--accent-2);
  }
  .entry--maintenance::before { background: var(--border); }
  .entry--maintenance { opacity: 0.7; }
  .entry h2 {
    font-size: 1rem;
    font-weight: 700;
    margin: 0 0 0.75rem;
    border: none;
    padding: 0;
  }
  .entry ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0 0 0.75rem;
    padding: 0;
  }
  .entry li { margin: 0; }
  .site-chip {
    display: inline-flex;
    align-items: center;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.3em 0.7em;
    font-size: 0.85em;
    color: var(--fg);
    text-decoration: none;
    font-weight: 500;
  }
  .site-chip:hover { border-color: var(--accent); color: var(--accent); }
  .entry p { margin: 0; font-size: 0.85em; }
  .commit-badge {
    display: inline-block;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.1em 0.6em;
    text-decoration: none;
    color: var(--fg);
  }
  .commit-badge:hover { color: var(--accent); border-color: var(--accent); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <nav class="style-switch" aria-label="表示スタイル切り替え">
    <a href="index.html">GitHub風</a>
    <a href="dashboard.html" aria-current="page">ダッシュボード</a>
    <a href="minimal.html">ミニマル</a>
  </nav>
  <header>
    <h1>g医t ダッシュボード</h1>
    <p id="status">読み込み中…</p>
  </header>
  <div class="stats" id="stats"></div>
  <div id="content"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/lib/marked.umd.min.js"></script>
<script src="report.js"></script>
<script>
  reportPage.loadReport({
    onContent: (content) => {
      reportPage.renderStats(content, document.getElementById("stats"));
      document.getElementById("status").textContent =
        "生成: " + reportPage.formatJst();
    },
    onError: (err) => {
      document.getElementById("status").textContent =
        "レポートの読み込みに失敗しました: " + err.message;
    },
  });
</script>
</body>
</html>
