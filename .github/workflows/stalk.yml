name: Stalk websites

on:
  schedule:
    - cron: "55 */6 * * *"
  workflow_dispatch:

concurrency:
  group: stalk-websites
  cancel-in-progress: false

jobs:
  stalk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      # Checked out as siblings (not nested) so the tool's source checkout
      # never shows up as untracked content in the tracker repo - website-stalker
      # refuses --commit in an "unclean" repository.
      - name: Checkout tracker repo
        uses: actions/checkout@v7
        with:
          path: tracker
          fetch-depth: 0

      - name: Checkout website-stalker source
        uses: actions/checkout@v7
        with:
          repository: TanukiMa/website-stalker
          path: website-stalker-src

      - uses: dtolnay/rust-toolchain@stable
        id: rust

      # Caches ~/.cargo/registry, ~/.cargo/git and target/ together, keyed on
      # Cargo.lock. Unlike a plain actions/cache on target/, this survives the
      # fresh checkout's reset mtimes (it fixes them up on restore), so an
      # unchanged Cargo.lock gives a real incremental build instead of a full
      # rebuild every 6h.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: website-stalker-src
          shared-key: website-stalker-bin

      - name: Build website-stalker
        working-directory: website-stalker-src
        run: cargo build --release --locked

      - name: Configure git identity
        working-directory: tracker
        run: |
          git config user.name "website-stalker-bot"
          git config user.email "website-stalker-bot@users.noreply.github.com"

      - name: Record commit before stalking
        id: before
        working-directory: tracker
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # continue-on-error: a single flaky site (timeout, temporary 5xx, ...)
      # makes website-stalker exit non-zero even though it already committed
      # every site that DID succeed. Don't let that abort the report/push steps.
      - name: Run website-stalker
        working-directory: tracker
        continue-on-error: true
        run: ../website-stalker-src/target/release/website-stalker run --all --commit

      - name: Detect changes
        id: changes
        working-directory: tracker
        run: |
          after="$(git rev-parse HEAD)"
          if [ "${{ steps.before.outputs.sha }}" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: Update change report
        if: steps.changes.outputs.changed == 'true'
        working-directory: tracker
        run: bash update_report.sh "${{ steps.changes.outputs.sha }}"

      - name: Commit change report
        if: steps.changes.outputs.changed == 'true'
        working-directory: tracker
        run: |
          git add CHANGELOG.md
          git commit -m "docs(report): update change report for ${{ steps.changes.outputs.sha }}"

      - name: Push
        if: steps.changes.outputs.changed == 'true'
        working-directory: tracker
        run: git push

  pages:
    needs: stalk
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/configure-pages@v5

      # report.js has no cache-busting in its <script src>, so browsers can
      # keep serving a stale cached copy after a redeploy (e.g. a function
      # added to report.js "not existing" in a visitor's browser even
      # though the deployed file is current). Append the commit sha as a
      # query string so every content change gets a new URL.
      - name: Build pages site
        run: |
          sha="$(git rev-parse HEAD)"
          mkdir -p _site
          cp index.html dashboard.html minimal.html report.js _site/
          cp CHANGELOG.md _site/CHANGELOG.md
          sed -i "s/report\.js\"/report.js?v=${sha}\"/" _site/index.html _site/dashboard.html _site/minimal.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
