# yaml-language-server: $schema=https://github.com/EdJoPaTo/website-stalker/releases/latest/download/website-stalker-schema.json
#
# Tracked sites: Japanese medical / healthcare regulatory pages.
# Run via `website-stalker run --all --commit` (see .github/workflows/stalk.yml).
---
from: matanuki@dr.com
sites:
  - url: https://www.ssk.or.jp/seikyushiharai/tensuhyo/kihonmasta/kihonmasta_07.html
    editors:
      - css_select: "table"
  - url: https://www.ssk.or.jp/seikyushiharai/tensuhyo/kihonmasta/kihonmasta_04.html
    editors:
      - css_select: "table"
  - url: https://www.ssk.or.jp/seikyushiharai/tensuhyo/kihonmasta/kihonmasta_05.html
    editors:
      - css_select: "table"
  - url: https://www.ssk.or.jp/seikyushiharai/tensuhyo/kihonmasta/kihonmasta_01.html
    editors:
      - css_select: "table" 
  - url: https://www.mhlw.go.jp/topics/2026/04/tp20260401-01.html
  - url: https://www.pmda.go.jp/safety/info-services/drugs/calling-attention/properly-use-alert/0004.html
    http1_only: true
    ignore_error: true
    headers:
    - "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  - url: https://www.pmda.go.jp/safety/info-services/drugs/calling-attention/properly-use-alert/0001.html
    http1_only: true
    ignore_error: true
  - url: https://www.pmda.go.jp/safety/info-services/ivd/0008.html
    name: "自主点検通知（体外診断用医薬品）- PMDA.go.jp"
    http1_only: true
    ignore_error: true
  - url: https://gemmed.ghc-j.com/
    editors:
      # Rotating ad banners (all wrapped in <aside>, plus one bare
      # .header-banner div up top) swap images/links on every request,
      # which made every fetch look like a change regardless of whether
      # any article actually changed.
      - css_remove: "aside, .header-banner"
      # The category <dd> list (mobile menu + footer) is also rendered
      # in a random order on every request. Sort it so the order is
      # deterministic instead of triggering a false change each time.
      - css_sort:
          selector: "dl.menusp dd, dl.footlist dd"
  - url: https://www.mhlw.go.jp/stf/new-info/
  - url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/topics_150873_139_140.html
  - url: https://shinryohoshu.mhlw.go.jp/shinryohoshu/downloadMenu/
    editors:
      - css_select: "table"
      # This site embeds a per-request session id (;jsessionid=...) in every
      # link, so the raw HTML never matches byte-for-byte between two fetches.
      # Strip it so only real content changes are detected.
      - regex_replace:
          pattern: ';jsessionid=[0-9A-Fa-f]{32}'
          replace: ""
  - url: https://shinryohoshu.mhlw.go.jp/shinryohoshu/
    editors:
      # Same per-request session id as above.
      - regex_replace:
          pattern: ';jsessionid=[0-9A-Fa-f]{32}'
          replace: ""
      # This page also shows a live visitor counter ("あなたは12345人目の訪問者です")
      # that increments on every fetch. Normalize it away too.
      - regex_replace:
          pattern: 'あなたは[0-9]+人目の訪問者です'
          replace: "あなたはN人目の訪問者です"
  - url: https://www.ssk.or.jp/seikyushiharai/tensuhyo/kihonmasta/r06kaiteijoho.html
  - url: https://www.chemotherapy.or.jp/modules/newslist/index.php?content_id=4
    editors:
      # The <head> flip-flops between requests (title with/without "重要な",
      # a main_css <link> that randomly appears/disappears), which made
      # every fetch look like a change even though the news list itself
      # hadn't. Track only the actual content container.
      - css_select: "#box_main"
  - url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/topics_150864_135_130.html
  - url: https://www.jsir.or.jp/about/guide_line/
  - url: https://www.naika.or.jp/nintei/
  - url: https://www.chemotherapy.or.jp/modules/newslist/index.php?content_id=3
    editors:
      - css_select: "#box_main"
  - url: https://www.radiology.jp/guideline
  - url: https://www.j-circ.or.jp/guideline/guideline-series/
  - url: https://www.kekkaku.gr.jp/medical_staff/
  - url: https://jsnm.org/useful/guidelines/
  - url: https://www.jibika.or.jp/modules/guidelines/index.php?content_id=1
    name: "診療ガイドライン／手引き・マニュアル INDEX - 日本耳鼻咽喉科頭頸部外科学会"
    editors:
      - css_select: body
      - html_prettify
  - url: https://jrs-gl.radiology.jp/
  - url: https://www.jami.jp/
    editors:
      # The GTranslate plugin's language-switcher popup (#popup) and its two
      # <script> tags embed a random widget id that's regenerated on every
      # request (e.g. gt-wrapper-86024623 -> gt-wrapper-53313029), which made
      # every fetch look like a change with nothing actually different.
      - css_remove: '#popup, script[id^="gt_widget_script_"], script[src*="gtranslate"]'
  - url: https://www.naika.or.jp/
  - url: https://www.jssoc.or.jp/
